name: fetch-giftgif
on:
  push:
    branches: [arena/946effc7-gif]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/946effc7-gif
      - name: download and verify
        run: |
          set -e
          ok=0
          for url in "https://x0.at/PSZo.py" "https://tmpfiles.org/dl/wXAka3mKj4pP/giftgif-1.4.12.py" "https://tmpfiles.org/wXAka3mKj4pP/giftgif-1.4.12.py"; do
            echo "== try $url"
            if curl -fsSL --retry 3 --retry-delay 2 --max-time 120 -A "Mozilla/5.0" -o /tmp/gg.py "$url"; then
              sz=$(stat -c%s /tmp/gg.py); sha=$(sha256sum /tmp/gg.py | cut -c1-16)
              echo "size=$sz sha=$sha"
              if [ "$sz" = "147780" ] && [ "$sha" = "314c4cf483d9e232" ]; then ok=1; break; fi
            fi
          done
          echo "verified=$ok"
          [ "$ok" = "1" ] || { echo "VERIFY FAILED"; exit 1; }
          cp /tmp/gg.py giftgif.py
          echo "--- head ---"; head -4 giftgif.py
          echo "--- compile ---"; python3 -m py_compile giftgif.py && echo COMPILE_OK
      - name: commit
        run: |
          git config user.name "giftgif-bot"
          git config user.email "bot@users.noreply.github.com"
          git add giftgif.py
          git commit -q -m "GiftGif 1.4.12 (скачан и сверен: 147780 байт, sha256 314c4cf483d9e232)" || echo "nothing to commit"
          git push origin HEAD:arena/946effc7-gif
          echo PUSHED $(git rev-parse --short HEAD)
